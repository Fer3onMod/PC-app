name: Build Windows Application (.exe)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Setup & Portable .EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Type Check & Lint
        run: npm run lint

      - name: Build Web Assets (Vite with Relative Base)
        run: npm run build

      - name: Package Windows Executables (.exe)
        run: npx electron-builder --win --x64 --publish never

      - name: Upload Windows Executable Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TopSecurity-Windows-App-Exe
          path: dist-electron/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Set Release Metadata
        if: success() && github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: release_meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "release_name=Top Security لويندوز ${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=v1.0.${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT
            echo "release_name=Top Security لويندوز (تحديث #${GITHUB_RUN_NUMBER})" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        if: success() && github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-electron/*.exe
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_meta.outputs.release_name }}
          body: |
            ## تحميل برنامج Top Security لإدارة المبيعات والفواتير والمخازن 🛡️
            
            تم بناء ملفات التشغيل والتثبيت بنجاح وجاهزة للاستخدام المباشر على ويندوز:
            - **برنامج التثبيت الرسمي الكامل:** `TopSecurity-Setup.exe` (يقوم بتثبيت البرنامج مع إنشاء اختصار على سطح المكتب وقائمة ابدأ)
            - **النسخة المحمولة (Portable):** `TopSecurity-Portable.exe` (يعمل مباشرة بنقرة واحدة بدون الحاجة لتثبيت)
            
            ### ملاحظات بعد التحديث:
            - تم حل مشكلة الشاشة الزرقاء الفارغة بالكامل عبر ضبط المسارات النسبية للملفات ومحرك Electron.
            - التطبيق يعمل بالكامل دون الحاجة إلى اتصال بالإنترنت.
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
