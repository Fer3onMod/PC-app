name: Build Windows Application (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Setup & Portable .EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Package Windows Executables (.exe)
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-App-Exe
          path: |
            dist-electron/*.exe
            dist-electron/*.blockmap
          retention-days: 30

      - name: Create GitHub Release (On Tag or Dispatch)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: dist-electron/*.exe
          name: نظام التاجر لويندوز ${{ github.ref_name }}
          body: |
            برنامج نظام التاجر لإدارة حسابات ومبيعات ومخزون المحلات التجارية وطباعة الفواتير.
            - ملف التثبيت: `Tajir-Setup.exe`
            - ملف محمول (بدون تثبيت): `Tajir-Portable.exe`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
