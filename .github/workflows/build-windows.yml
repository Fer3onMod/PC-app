name: Build Windows Application (.exe)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Setup & Portable .EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Type Check & Lint
        run: npm run lint

      - name: Extract Version Info from package.json
        id: pkg_version
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=${VER}" >> $GITHUB_OUTPUT
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VER}"
          fi
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "release_name=Top Security v${VER}" >> $GITHUB_OUTPUT

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Package Windows Executables (.exe)
        run: npx electron-builder --win --x64 --publish never

      - name: Upload Windows Executable Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TopSecurity-Windows-v${{ steps.pkg_version.outputs.version }}
          path: dist-electron/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: success() && github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-electron/*.exe
          tag_name: ${{ steps.pkg_version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.pkg_version.outputs.release_name }}
          make_latest: true
          body: |
            ## تحميل برنامج Top Security لإدارة المبيعات والفواتير والمخازن 🛡️
            
            **رقم الإصدار:** `${{ steps.pkg_version.outputs.version }}`
            
            تم بناء ملفات التشغيل والتثبيت بنجاح وجاهزة للاستخدام المباشر على ويندوز:
            - **برنامج التثبيت الرسمي الكامل:** `TopSecurity-Setup-${{ steps.pkg_version.outputs.version }}.exe` (يقوم بتثبيت البرنامج مع إنشاء اختصار على سطح المكتب وقائمة ابدأ)
            - **النسخة المحمولة (Portable):** `TopSecurity-Portable-${{ steps.pkg_version.outputs.version }}.exe` (يعمل مباشرة بنقرة واحدة بدون الحاجة لتثبيت)
            
            ### مميزات هذا التحديث:
            - تضمين رقم الإصدار في اسم ملف التطبيق تلقائياً (${{ steps.pkg_version.outputs.version }}).
            - تفعيل فحص وتنبيه التحديثات التلقائي داخل البرنامج.
            - التطبيق يعمل بالكامل محلياً أوفلاين دون الحاجة لاتصال بالإنترنت.
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

