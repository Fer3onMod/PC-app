name: Build Windows Application (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Setup & Portable .EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application to Native JavaScript
        run: npm run build

      - name: Package Windows Executables (.exe)
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TopSecurity-Windows-App-Exe
          path: |
            dist-electron/*.exe
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: dist-electron/*.exe
          tag_name: v1.0.0
          name: Top Security لويندوز v1.0.0
          body: |
            برنامج Top Security لإدارة حسابات ومبيعات ومخزون المحلات التجارية وأنظمة المراقبة وطباعة الفواتير.
            - ملف التثبيت المباشر لويندوز: `TopSecurity-Setup.exe`
            - النسخة المحمولة (بدون تثبيت): `TopSecurity-Portable.exe`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
